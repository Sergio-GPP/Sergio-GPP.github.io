<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Sistema editorial con inteligencia artificial</title>
  <desc id="desc">Esquema genérico del flujo desde briefing y fuentes hasta borrador, revisión y calendario. No muestra contenido de un cliente.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#111915"/><stop offset="1" stop-color="#0a0d0b"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b1ed8f" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="960" height="600" fill="url(#back)"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <rect x="55" y="53" width="850" height="494" rx="18" fill="#101612" stroke="#3e5841" stroke-width="2"/>
  <path d="M55 111h850" stroke="#314735" stroke-width="2"/>
  <circle cx="85" cy="83" r="6" fill="#b1ed8f"/><circle cx="107" cy="83" r="6" fill="#58765b"/><circle cx="129" cy="83" r="6" fill="#58765b"/>
  <text x="162" y="90" fill="#d8e8d4" font-family="Arial,sans-serif" font-size="18" font-weight="700">SISTEMA EDITORIAL</text>
  <text x="714" y="88" fill="#b1ed8f" font-family="monospace" font-size="14">REVISIÓN HUMANA</text>
  <text x="88" y="160" fill="#b1ed8f" font-family="monospace" font-size="13" letter-spacing="2">DE LA IDEA A LA PIEZA REVISABLE</text>
  <text x="88" y="211" fill="#f1f6ec" font-family="Arial,sans-serif" font-size="33" font-weight="700">Contenido con contexto y control</text>
  <g font-family="Arial,sans-serif">
    <rect x="88" y="254" width="168" height="152" rx="8" fill="#18231a" stroke="#426045"/>
    <text x="108" y="286" fill="#b1ed8f" font-size="13" font-weight="700">01 / ENTRADA</text>
    <text x="108" y="328" fill="#e5eee1" font-size="19">Briefing</text>
    <text x="108" y="359" fill="#aebcac" font-size="15">+ fuentes</text>
    <rect x="291" y="254" width="168" height="152" rx="8" fill="#18231a" stroke="#426045"/>
    <text x="311" y="286" fill="#b1ed8f" font-size="13" font-weight="700">02 / IA</text>
    <text x="311" y="328" fill="#e5eee1" font-size="19">Borradores</text>
    <text x="311" y="359" fill="#aebcac" font-size="15">por canal</text>
    <rect x="494" y="254" width="168" height="152" rx="8" fill="#18231a" stroke="#426045"/>
    <text x="514" y="286" fill="#b1ed8f" font-size="13" font-weight="700">03 / EQUIPO</text>
    <text x="514" y="328" fill="#e5eee1" font-size="19">Revisión</text>
    <text x="514" y="359" fill="#aebcac" font-size="15">y aprobación</text>
    <rect x="697" y="254" width="168" height="152" rx="8" fill="#18231a" stroke="#426045"/>
    <text x="717" y="286" fill="#b1ed8f" font-size="13" font-weight="700">04 / AGENDA</text>
    <text x="717" y="328" fill="#e5eee1" font-size="19">Calendario</text>
    <text x="717" y="359" fill="#aebcac" font-size="15">editorial</text>
    <path d="M261 330h24m-7-7 7 7-7 7m186-7h24m-7-7 7 7-7 7m186-7h24m-7-7 7 7-7 7" fill="none" stroke="#b1ed8f" stroke-width="2"/>
  </g>
  <rect x="88" y="444" width="777" height="56" rx="5" fill="#142018" stroke="#426045"/>
  <text x="111" y="478" fill="#d8e8d4" font-family="Arial,sans-serif" font-size="16">La agenda ordena el trabajo; el envío a redes requiere integración aprobada.</text>
  <text x="88" y="528" fill="#89a48c" font-family="monospace" font-size="12">ESQUEMA ILUSTRATIVO · SIN DATOS REALES</text>
</svg>
